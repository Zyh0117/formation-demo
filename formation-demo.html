<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛事回顾 · 双方阵容演示</title>
<link rel="stylesheet" href="./match-lineups.css">
<style>
  :root {
    --pitch-green: #2e7d32;
    --pitch-light: #3c8c40;
    --pitch-dark: #256428;
    --line: rgba(255,255,255,.82);
    --home: #2979ff;
    --home-dark: #1565c0;
    --away: #ffffff;
    --away-dark: #cfd8dc;
    --card-bg: #fff;
    --text: #1a1a1a;
    --sub-text: #555;
    --border: #e0e0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: var(--text);
    padding: 16px;
    min-height: 100vh;
  }
  header {
    max-width: 1200px;
    margin: 0 auto 16px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }
  header h1 { font-size: 18px; margin-bottom: 12px; }
  .mode-switch { display: flex; gap: 8px; margin-bottom: 12px; }
  .mode-switch button {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #f5f6f8;
    cursor: pointer;
    font-size: 14px;
    color: var(--sub-text);
  }
  .mode-switch button.active {
    background: #2979ff;
    color: #fff;
    border-color: #2979ff;
  }
  .formation-bar {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .formation-bar .team-label { font-weight: 700; font-size: 14px; }
  .formation-bar .home-label { color: #1565c0; }
  .formation-bar .away-label { color: #555; }
  select {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    background: #fff;
  }
  .hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--sub-text);
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
    padding: 8px 12px;
  }
  /* 工具栏：撤销/重做/导入导出 */
  .action-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .tool-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: #37474f;
    cursor: pointer;
    font-size: 13px;
    transition: background .15s, border-color .15s;
  }
  .tool-btn:hover:not(:disabled) { background: #f5f7fa; border-color: #90a4ae; }
  .tool-btn:disabled { opacity: .4; cursor: not-allowed; }
  .save-tip {
    font-size: 12px;
    color: #90a4ae;
    margin-left: auto;
  }
  .save-tip.flash { color: #2e7d32; }
  /* 名单搜索框 */
  .squad-search {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 10px;
    margin: 6px 0 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    outline: none;
  }
  .squad-search:focus { border-color: #2979ff; box-shadow: 0 0 0 2px rgba(41,121,255,.15); }
  .no-result {
    font-size: 12px;
    color: #90a4ae;
    padding: 8px 4px;
    text-align: center;
  }
  /* 替补席条目：参考直播吧样式（号码头像 + 名字 + 换下信息） */
  .sub-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .12s;
    position: relative;
  }
  .sub-item:hover { background: #f2f5f9; }
  .sub-item.selected { background: #e3f2fd; box-shadow: inset 0 0 0 1px #90caf9; }
  .sub-item.used { background: #f7fbf7; }
  .sub-avatar {
    width: 38px; height: 38px;
    flex: 0 0 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.16);
    position: relative;
  }
  .sub-item.home .sub-avatar { background: linear-gradient(145deg,#42a5f5,#1565c0); color:#fff; }
  .sub-item.away .sub-avatar { background: linear-gradient(145deg,#eceff1,#b0bec5); color:#37474f; }
  .sub-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .sub-name {
    font-size: 13px;
    font-weight: 600;
    color: #263238;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub-meta {
    font-size: 11px;
    color: #90a4ae;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub-meta .out-name { color: #e65100; font-weight: 600; }
  .sub-right {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .sub-min {
    font-size: 11px; font-weight: 800;
    color: #2e7d32;
    white-space: nowrap;
  }
  .sub-min.in { color: #2e7d32; }
  .sub-min.out { color: #e53935; }
  .sub-meta .in-name { color: #2e7d32; font-weight: 600; }
  .sub-item.subbed-off { opacity: .72; }
  .sub-item.subbed-off .sub-avatar { filter: grayscale(.7); }
  .sub-item.subbed-off .sub-name { color: #78909c; }
  /* 首发名单中已被换下的球员 */
  .player-row.off-row {
    opacity: .66;
    background: #f7f8fa;
    border: 1px dashed #cfd8dc;
  }
  .player-row.off-row .jn { filter: grayscale(1); }
  .off-by { font-size: 11px; color: #90a4ae; }
  .sub-in-btn {
    border: none;
    background: #2979ff;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 12px;
    cursor: pointer;
  }
  .sub-in-btn:hover { background: #1565c0; }
  .sub-in-btn:disabled { background: #cfd8dc; cursor: not-allowed; }
  .sub-empty {
    font-size: 12px;
    color: #b0bec5;
    text-align: center;
    padding: 10px 0;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 260px 1fr 260px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .squad-panel { order: 2; }
    .pitch-wrap { order: 1; }
  }
  .squad-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    max-height: 78vh;
    overflow-y: auto;
  }
  .squad-panel .panel-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .squad-panel .panel-title.home { color: var(--home-dark); }
  .squad-panel .panel-title.away { color: #455a64; }
  .squad-panel .sub-heading {
    font-size: 11px;
    color: var(--sub-text);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin: 10px 0 6px;
  }
  .player-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .player-row:hover { background: #f0f4ff; }
  .player-row.selected { background: #e3edff; border-color: #2979ff; }
  .player-row.on-pitch { background: #f5f6f8; border-color: #d0e3ff; }
  .player-row .jn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #eceff1;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .player-row.home .jn { background: var(--home); color: #fff; }
  .player-row.away .jn { background: #eceff1; color: #263238; border: 1px solid #cfd8dc; }
  .player-row .nm { flex: 1; font-size: 13px; }
  .player-row .mini-badge { font-size: 11px; color: #fff; border-radius: 4px; padding: 1px 4px; }
  .player-row .sub-in-btn {
    font-size: 11px;
    border: 1px solid #2979ff;
    color: #2979ff;
    background: #fff;
    border-radius: 6px;
    padding: 2px 6px;
    cursor: pointer;
  }
  .player-row .sub-in-btn:hover { background: #2979ff; color: #fff; }

  .pitch-wrap {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pitch {
    position: relative;
    width: 100%;
    max-width: 460px;
    aspect-ratio: 3 / 4.6;
    border-radius: 10px;
    overflow: hidden;
    background:
      repeating-linear-gradient(0deg, var(--pitch-green) 0 34px, var(--pitch-light) 34px 68px);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    touch-action: manipulation;
  }
  /* 半场底色区分，避免主客队放混 */
  .pitch::before, .pitch::after {
    content: '';
    position: absolute; left: 0; right: 0;
    z-index: 1;
    pointer-events: none;
  }
  .pitch::before { top: 0; bottom: 50%; background: rgba(41,121,255,.06); }   /* 主队半场淡蓝 */
  .pitch::after { top: 50%; bottom: 0; background: rgba(255,255,255,.06); }    /* 客队半场淡白 */
  .pitch svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .name-strip {
    position: absolute; left: 0; right: 0;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    z-index: 2;
    opacity: .9;
  }
  .name-strip.home { top: 0; color: #fff; background: var(--home-dark); }
  .name-strip.away { bottom: 0; color: #263238; background: #eceff1; }

  .player-marker {
    position: absolute;
    transform: translate(-50%, -38%);
    z-index: 3;
    cursor: pointer;
    text-align: center;
    user-select: none;
  }
  .player-marker .num {
    width: 36px; height: 36px;
    margin: 0 auto;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
    transition: transform .1s;
    position: relative;
  }
  .player-marker:hover .num { transform: scale(1.12); }
  .player-marker.home .num { background: var(--home); color: #fff; border: 2px solid #fff; }
  .player-marker.away .num { background: var(--away); color: #263238; border: 2px solid #90a4ae; }
  .player-marker.pickable .num::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 2px dashed #ffeb3b;
    border-radius: 50%;
    opacity: .9;
  }
  /* 球员名字 */
  .player-marker .pname {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
    margin-top: 2px;
    white-space: nowrap;
  }
  /* 事件角标容器：定位在号码圆圈右上角 */
  .player-marker .badges {
    position: absolute;
    top: -2px;
    right: -6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    z-index: 4;
  }
  /* 进球标记：红圈+⚽ */
  .badge-goal {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #e53935;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.5);
    border: 1.5px solid #fff;
  }
  .badge-goal::before { content: '⚽'; font-size: 10px; }
  /* 助攻标记：绿圈+A */
  .badge-assist {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #43a047;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.5);
    border: 1.5px solid #fff;
  }
  .badge-assist::before { content: 'A'; }
  /* 黄牌 */
  .badge-yellow {
    width: 10px; height: 14px;
    background: #fbc02d;
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
    border: 1px solid #fff;
  }
  /* 红牌 */
  .badge-red {
    width: 10px; height: 14px;
    background: #e53935;
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
    border: 1px solid #fff;
  }
  /* 换人标记：箭头 + 分钟，显示在名字下方 */
  .player-marker .sub-tag {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 52px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 1px;
    padding: 1px 4px;
    border-radius: 4px;
    z-index: 4;
  }
  .sub-tag.out { color: #fff; background: #e53935; text-shadow: none; }
  .sub-tag.in { color: #fff; background: #43a047; text-shadow: none; }
  .sub-tag .arrow { font-size: 12px; }

  .empty-slot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.7);
    z-index: 2;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.85);
    font-size: 14px;
    font-weight: 700;
  }
  .empty-slot.blocked {
    border-color: rgba(255,100,100,.5);
    cursor: not-allowed;
    opacity: .3;
  }

  .pitch-legend {
    margin-top: 10px;
    font-size: 12px;
    color: var(--sub-text);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .pitch-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.goal { background: #26c6da; }
  .dot.assist { background: #43a047; }
  .dot.yellow { background: #fbc02d; }
  .dot.red { background: #e53935; }
  .dot.sub { background: #ffb74d; }

  /* 弹层 */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .modal h3 { font-size: 15px; margin-bottom: 12px; }
  .modal .pname { color: #2979ff; }
  .stat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { font-size: 14px; }
  .stat-row .ctl { display: flex; align-items: center; gap: 8px; }
  .stat-row .ctl button {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #f5f6f8;
    cursor: pointer; font-size: 15px; font-weight: 700;
  }
  .stat-row .ctl .val { min-width: 24px; text-align: center; font-weight: 700; }
  .modal .close-btn {
    margin-top: 14px;
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: none;
    background: #2979ff; color: #fff;
    cursor: pointer; font-size: 14px;
  }
  .sub-form label { display: block; font-size: 13px; margin-bottom: 6px; }
  .sub-form input {
    width: 100%; padding: 8px; border-radius: 8px;
    border: 1px solid var(--border); font-size: 14px; margin-bottom: 12px;
  }
  .sub-form .btns { display: flex; gap: 8px; }
  .sub-form .btns button { flex: 1; padding: 9px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .sub-form .confirm { background: #2979ff; color: #fff; border: none; }
  .sub-form .cancel { background: #f5f6f8; border: 1px solid var(--border); color: var(--sub-text); }
  .match-demo {
    max-width: 760px;
    margin: 0 auto 18px;
    padding: clamp(12px, 3vw, 28px);
    border: 1px solid #e0e7e2;
    border-radius: 16px;
    background: #fff;
    color: #172b23;
  }
  .match-demo h1 { font-size: 1.35rem; }
  .match-demo .demo-title-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .match-demo .demo-note { color: #526457; font-size: .82rem; margin: 4px 0 14px; }
  .match-demo .demo-scoreboard {
    display: grid;
    grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
    align-items: center;
    gap: clamp(6px,2vw,16px);
    padding: 18px 8px;
    border: 1px solid #20556a;
    border-radius: 12px;
    background: linear-gradient(135deg, #173f57, #23738a);
    color: #fff;
    text-align: center;
    font-weight: 700;
    font-size: .88rem;
    overflow-wrap: anywhere;
  }
  .match-demo .demo-team { display: grid; justify-items: center; gap: 6px; line-height: 1.35; }
  .match-demo .demo-team-badge { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid #f0f8ff; border-radius: 50%; background: #afdff2; color: #163c4e; font-size: .77rem; }
  .match-demo .demo-team-away .demo-team-badge { background: #faf9ec; }
  .match-demo .demo-score { display: grid; font-size: 1.75rem; white-space: nowrap; }
  .match-demo .demo-score small { font-size: .75rem; font-weight: 600; }
  .match-demo .demo-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0; color: #526457; font-size: .84rem; }
  .match-demo .demo-tabs { display: flex; gap: 14px; margin-bottom: 12px; border-bottom: 1px solid #dce5df; }
  .match-demo .demo-tabs button { padding: 8px 4px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #526457; font: inherit; cursor: pointer; }
  .match-demo .demo-tabs button[aria-selected="true"] { color: #176842; border-bottom-color: #176842; font-weight: 700; }
  .match-demo .demo-events { display: grid; gap: 8px; list-style: none; }
  .match-demo .demo-events li { border-radius: 8px; background: #f3f7f5; padding: 10px; font-size: .9rem; }
  .match-demo [hidden] { display: none; }
  .editor-demo { max-width: 1200px; margin: auto; }
  .editor-demo > summary { cursor: pointer; margin-bottom: 12px; padding: 10px 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; font-weight: 700; }
</style>
</head>
<body>
<section class="match-demo" aria-labelledby="demoTitle">
  <div class="demo-title-row">
    <h1 id="demoTitle">赛事回顾</h1>
    <button type="button" class="tool-btn" id="editLineups" aria-controls="lineupEditor">编辑双方阵容</button>
  </div>
  <p class="demo-note">演示数据 · 阵型位置和比赛事件为示例</p>
  <div id="demoScore" class="demo-scoreboard" aria-label="比赛比分"></div>
  <p id="demoMeta" class="demo-meta"></p>
  <div class="demo-tabs" role="tablist" aria-label="比赛详情">
    <button id="demoEventsTab" type="button" role="tab" aria-controls="demoEvents" aria-selected="false" tabindex="-1">关键事件</button>
    <button id="demoLineupsTab" type="button" role="tab" aria-controls="demoLineups" aria-selected="true">双方阵容</button>
  </div>
  <div id="demoEvents" role="tabpanel" aria-labelledby="demoEventsTab" hidden></div>
  <div id="demoLineups" role="tabpanel" aria-labelledby="demoLineupsTab"></div>
</section>

<details class="editor-demo" id="lineupEditor">
<summary>编辑双方阵容</summary>
<header>
  <h1>阵容编辑工具</h1>
  <p class="hint">先在任一队名单中选择球员，再点击同队场上的位置。编辑会同步到上方「双方阵容」。</p>
  <button type="button" class="tool-btn" id="previewLineups">查看双方阵容</button>
  <div class="mode-switch">
    <button data-mode="lineup" class="active">赛前排兵</button>
    <button data-mode="stats">赛后标注</button>
  </div>
  <div class="formation-bar">
    <label class="team-label home-label" for="homeFormation">主队阵型</label>
    <select id="homeFormation"></select>
    <label class="team-label away-label" for="awayFormation">客队阵型</label>
    <select id="awayFormation"></select>
    <button id="autoFillBtn" style="margin-left:auto;padding:6px 14px;border-radius:8px;border:1px solid #2979ff;background:#2979ff;color:#fff;cursor:pointer;font-size:13px;">一键排入</button>
    <button id="clearBtn" style="padding:6px 14px;border-radius:8px;border:1px solid #e53935;background:#fff;color:#e53935;cursor:pointer;font-size:13px;">清空阵容</button>
  </div>
  <div class="action-bar">
    <button id="undoBtn" class="tool-btn" disabled title="撤销 (Ctrl+Z)">↶ 撤销</button>
    <button id="redoBtn" class="tool-btn" disabled title="重做 (Ctrl+Y)">↷ 重做</button>
    <button id="exportBtn" class="tool-btn">↓ 导出 JSON</button>
    <button id="importBtn" class="tool-btn">↑ 导入 JSON</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    <span class="save-tip" id="saveTip">改动会自动保存到本地</span>
  </div>
  <div class="hint" id="hint"></div>
</header>

<main>
  <aside class="squad-panel" id="homeSquad"></aside>
  <section class="pitch-wrap">
    <div class="pitch" id="pitch"></div>
    <div class="pitch-legend">
      <span><i class="dot goal"></i>进球</span>
      <span><i class="dot assist"></i>助攻</span>
      <span><i class="dot yellow"></i>黄牌</span>
      <span><i class="dot red"></i>红牌</span>
      <span><i class="dot sub"></i>换人</span>
    </div>
  </section>
  <aside class="squad-panel" id="awaySquad"></aside>
</main>
</details>

<div class="modal-mask" id="mask">
  <div class="modal" id="modal"></div>
</div>

<script src="./match-lineups.js"></script>
<script src="./match-preview.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- 常量 ---------- */
  var FORMATIONS = ['4-4-2','4-3-3','3-5-2','4-2-3-1','3-4-3','5-4-1','4-5-1','4-1-4-1','3-4-1-2','5-3-2'];

  var demo = window.MatchDemo;
  var teams = ['home', 'away'];
  var roster = {};
  teams.forEach(function (team) {
    roster[team] = demo.match.lineups.filter(function (entry) { return entry.teamType === team; })
      .map(function (entry) {
        return { id: entry.playerId, jn: entry.player.jerseyNumber, name: entry.player.name };
      });
  });
  function teamName(team) { return demo.match[team + 'Team'].teamName; }

  /* ---------- 状态 ---------- */
  var state = {
    mode: 'lineup',          // lineup | stats
    selectedPlayer: null,    // { team, playerId }
    pendingSub: null,        // { team, playerId } 待换上的替补
    search: { home: '', away: '' },
    teams: {
      home: { formation: demo.formations.home.shape, slots: [], subs: [] },
      away: { formation: demo.formations.away.shape, slots: [], subs: [] }
    }
  };

  /* ---------- 持久化与历史 ---------- */
  var STORAGE_KEY = 'sztufa-formation-demo-match-preview-v1';
  var MAX_HISTORY = 60;
  var historyStack = { undo: [], redo: [] };

  function substitutionStatuses(team, slots) {
    var statuses = new Map();
    slots.forEach(function (slot) {
      var history = (slot.outs || []).concat(slot);
      for (var i = 0; i < history.length - 1; i++) {
        var outgoing = history[i];
        var incoming = history[i + 1];
        var previous = statuses.get(outgoing.playerId);
        if (previous) {
          previous.outAt = outgoing.at;
          previous.replacedByName = findPlayer(team, incoming.playerId).name;
        }
        statuses.set(incoming.playerId, {
          subAt: outgoing.at,
          replacedName: findPlayer(team, outgoing.playerId).name
        });
      }
    });
    return statuses;
  }

  function syncSubstitutionStatuses(team) {
    var t = state.teams[team];
    var statuses = substitutionStatuses(team, t.slots);
    t.subs.forEach(function (sub) {
      var status = statuses.get(sub.playerId) || {};
      sub.subAt = status.subAt;
      sub.outAt = status.outAt;
      sub.replacedName = status.replacedName;
      sub.replacedByName = status.replacedByName;
    });
  }

  function validateSnapshot(d) {
    if (!d || typeof d !== 'object') throw new Error('文件格式不正确');
    teams.forEach(function (team) {
      var src = d[team];
      if (!src || !FORMATIONS.includes(src.formation) || !Array.isArray(src.slots) || src.slots.length !== 11 || !Array.isArray(src.subs)) {
        throw new Error('缺少有效的主客队阵容或阵型');
      }
      var used = new Set();
      var subs = new Set();
      function checkPlayer(id, list) {
        if (!findPlayer(team, id) || list.has(id)) throw new Error('存在重复球员或球员不属于本场比赛');
        list.add(id);
      }
      function checkStats(record, timeFields) {
        if (!record || typeof record !== 'object') throw new Error('球员记录格式不正确');
        ['goals', 'assists', 'yellow', 'red'].forEach(function (key) {
          if (record[key] != null && (!Number.isSafeInteger(record[key]) || record[key] < 0)) throw new Error('统计数据必须是非负整数');
        });
        timeFields.forEach(function (key) {
          if (record[key] != null && (!Number.isInteger(record[key]) || record[key] < 1 || record[key] > 120)) throw new Error('换人分钟必须是 1–120 的整数');
        });
        ['byName', 'replacedName', 'replacedByName'].forEach(function (key) {
          if (record[key] != null && (typeof record[key] !== 'string' || /[<>&]/.test(record[key]))) throw new Error('换人说明含无效字符');
        });
      }
      src.slots.forEach(function (slot) {
        checkStats(slot, ['subIn', 'subOut']);
        if (slot.playerId != null) checkPlayer(slot.playerId, used);
        if (slot.outs != null && !Array.isArray(slot.outs)) throw new Error('换下球员记录格式不正确');
        (slot.outs || []).forEach(function (record) {
          checkStats(record, ['at']);
          if (!slot.playerId || record.at == null) throw new Error('换人记录不完整');
          checkPlayer(record.playerId, used);
        });
      });
      var statuses = substitutionStatuses(team, src.slots);
      src.subs.forEach(function (sub) {
        checkStats(sub, ['subAt', 'outAt']);
        checkPlayer(sub.playerId, subs);
        if (used.has(sub.playerId) && !statuses.has(sub.playerId)) {
          throw new Error('首发球员不能同时出现在替补席');
        }
      });
    });
  }

  // 只序列化必要字段：坐标可由阵型重建，不存
  function snapshotState() {
    return JSON.stringify({
      mode: state.mode,
      home: {
        formation: state.teams.home.formation,
        slots: state.teams.home.slots.map(function (s) {
          return { playerId: s.playerId, goals: s.goals, assists: s.assists,
                   yellow: s.yellow, red: s.red, subIn: s.subIn, subOut: s.subOut,
                   outs: (s.outs || []).map(function (o) { return Object.assign({}, o); }) };
        }),
        subs: state.teams.home.subs
      },
      away: {
        formation: state.teams.away.formation,
        slots: state.teams.away.slots.map(function (s) {
          return { playerId: s.playerId, goals: s.goals, assists: s.assists,
                   yellow: s.yellow, red: s.red, subIn: s.subIn, subOut: s.subOut,
                   outs: (s.outs || []).map(function (o) { return Object.assign({}, o); }) };
        }),
        subs: state.teams.away.subs
      }
    });
  }

  function restoreState(json) {
    var d = JSON.parse(json);
    validateSnapshot(d);
    state.mode = d.mode === 'stats' ? 'stats' : 'lineup';
    ['home', 'away'].forEach(function (team) {
      var src = d[team] || {};
      var t = state.teams[team];
      var formation = FORMATIONS.indexOf(src.formation) >= 0 ? src.formation : t.formation;
      t.formation = formation;
      // 用阵型重建坐标，再按索引回填球员与统计
      t.slots = buildSlots(formation, teamSide(team)).map(function (s) {
        return { line: s.line, idx: s.idx, x: s.x, y: s.y, playerId: null,
                 goals: 0, assists: 0, yellow: 0, red: 0, subIn: null, subOut: null, outs: [] };
      });
      (src.slots || []).forEach(function (os, i) {
        var target = t.slots[i];
        if (!target) return;
        target.playerId = os.playerId || null;
        target.goals = os.goals || 0;
        target.assists = os.assists || 0;
        target.yellow = os.yellow || 0;
        target.red = os.red || 0;
        target.subIn = (os.subIn == null ? null : os.subIn);
        target.subOut = (os.subOut == null ? null : os.subOut);
        target.outs = (os.outs || []).map(function (o) {
          return {
            playerId: o.playerId, at: o.at, byName: o.byName,
            goals: o.goals || 0, assists: o.assists || 0,
            yellow: o.yellow || 0, red: o.red || 0
          };
        });
      });
      t.subs = (src.subs || []).map(function (s) {
        return {
          playerId: s.playerId,
          subAt: s.subAt,
          replacedName: s.replacedName,
          outAt: s.outAt,
          replacedByName: s.replacedByName,
          goals: s.goals || 0, assists: s.assists || 0, yellow: s.yellow || 0, red: s.red || 0
        };
      });
    });
    state.selectedPlayer = null;
    state.pendingSub = null;
    syncModeButtons();
    render();
  }

  function saveLocal() {
    var tip = document.getElementById('saveTip');
    try {
      localStorage.setItem(STORAGE_KEY, snapshotState());
    } catch (e) {
      if (tip) {
        tip.textContent = '未保存到浏览器，可导出 JSON 保留改动';
        tip.classList.remove('flash');
      }
      return;
    }
    if (tip) {
      tip.textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      tip.classList.add('flash');
      setTimeout(function () { tip.classList.remove('flash'); }, 800);
    }
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      restoreState(raw);
      return true;
    } catch (e) {
      return false;
    }
  }

  function pushHistory() {
    historyStack.undo.push(snapshotState());
    if (historyStack.undo.length > MAX_HISTORY) historyStack.undo.shift();
    historyStack.redo.length = 0;
    updateHistoryButtons();
  }

  function undo() {
    if (!historyStack.undo.length) return;
    historyStack.redo.push(snapshotState());
    restoreState(historyStack.undo.pop());
    saveLocal();
  }

  function redo() {
    if (!historyStack.redo.length) return;
    historyStack.undo.push(snapshotState());
    restoreState(historyStack.redo.pop());
    saveLocal();
  }

  function updateHistoryButtons() {
    var u = document.getElementById('undoBtn');
    var r = document.getElementById('redoBtn');
    if (u) u.disabled = historyStack.undo.length === 0;
    if (r) r.disabled = historyStack.redo.length === 0;
  }

  function syncModeButtons() {
    document.querySelectorAll('.mode-switch button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-mode') === state.mode);
    });
  }

  /* ---------- 纯函数：阵型 -> 线人数 ---------- */
  function formationLines(formation) {
    return String(formation).split('-').map(Number).filter(function (n) { return n > 0; });
  }

  /* ---------- 纯函数：生成槽位坐标 ---------- */
  function buildSlots(formation, side) {
    var lines = formationLines(formation);   // 不含门将
    var slots = [];
    // 门将
    slots.push({ line: -1, idx: 0 });
    // 各条线
    for (var li = 0; li < lines.length; li++) {
      var count = lines[li];
      for (var i = 0; i < count; i++) {
        slots.push({ line: li, idx: i });
      }
    }
    // 计算 x/y（归一化 0~1）
    // 主队严格在上半场 (y < 0.5)，客队严格在下半场 (y > 0.5)，互不穿插
    slots.forEach(function (s) {
      var total = lines.length;
      var denom = Math.max(1, total - 1);
      if (s.line === -1) {
        s.x = 0.5;
        s.y = (side === 'home') ? 0.06 : 0.94;
        return;
      }
      var lineY;
      if (side === 'home') {
        // 主队：门将 0.06，各线从 0.16 起向中线方向排，最远不超过 0.46
        lineY = 0.16 + (s.line / denom) * 0.30;   // 0.16 ~ 0.46
      } else {
        // 客队：门将 0.94，各线从 0.84 起向中线方向排，最近不低于 0.54
        lineY = 0.84 - (s.line / denom) * 0.30;   // 0.84 ~ 0.54
      }
      var count = lines[s.line];
      s.x = (s.idx + 1) / (count + 1);
      s.y = lineY;
    });
    return slots;
  }

  function teamSide(team) { return team === 'home' ? 'home' : 'away'; }

  function initTeam(team) {
    var t = state.teams[team];
    var players = allPlayers(team);
    t.slots = buildSlots(t.formation, teamSide(team)).map(function (s) {
      return { line: s.line, idx: s.idx, x: s.x, y: s.y, playerId: null,
               goals: 0, assists: 0, yellow: 0, red: 0, subIn: null, subOut: null };
    });
    // 赛前清空：所有球员先进入候选名单，由用户手动摆放
    t.subs = players.map(function (p) { return { playerId: p.id }; });
  }

  function allPlayers(team) { return roster[team]; }
  function findPlayer(team, id) {
    var arr = allPlayers(team);
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
    return null;
  }

  function seedMatch() {
    teams.forEach(function (team) {
      initTeam(team);
      var t = state.teams[team];
      demo.formations[team].playerIds.forEach(function (id, i) { t.slots[i].playerId = id; });
      var starting = new Set(demo.formations[team].playerIds);
      t.subs = t.subs.filter(function (sub) { return !starting.has(sub.playerId); });
    });
    demo.match.events.forEach(function (event) {
      var t = state.teams[event.teamType];
      if (event.eventType === 'goal') {
        t.slots.find(function (slot) { return slot.playerId === event.playerId; }).goals++;
        if (event.assistPlayerId) t.slots.find(function (slot) { return slot.playerId === event.assistPlayerId; }).assists++;
      } else if (event.eventType === 'yellow_card') {
        t.slots.find(function (slot) { return slot.playerId === event.playerId; }).yellow++;
      } else if (event.eventType === 'substitution') {
        var slot = t.slots.find(function (slot) { return slot.playerId === event.subPlayerId; });
        var minute = parseInt(event.eventTime, 10);
        slot.outs = [{ playerId: slot.playerId, at: minute, byName: event.playerName,
          goals: slot.goals, assists: slot.assists, yellow: slot.yellow, red: slot.red }];
        slot.playerId = event.playerId;
        slot.subIn = minute;
        slot.goals = slot.assists = slot.yellow = slot.red = 0;
      }
    });
  }

  function publishMatch() {
    var lineups = [];
    var formations = {};
    var events = [];
    var fields = { goals: 'goal', assists: 'assist', yellow: 'yellow_card', red: 'red_card' };
    function publishStats(team, record, player) {
      Object.keys(fields).forEach(function (field) {
        var count = record[field];
        if (!Number.isSafeInteger(count) || count <= 0) return;
        var type = fields[field];
        var sample = demo.match.events.find(function (event) {
          return event.teamType === team && (event.playerId === player.id && event.eventType === type ||
            type === 'assist' && event.assistPlayerId === player.id);
        });
        events.push({ teamType: team, eventType: type, playerId: player.id, playerName: player.name,
          eventTime: sample?.eventTime, count: count });
      });
    }
    teams.forEach(function (team) {
      var t = state.teams[team];
      var startingIds = t.slots.map(function (slot) { return slot.outs?.[0]?.playerId || slot.playerId; });
      formations[team] = { shape: t.formation, playerIds: startingIds };
      function addPlayer(id, type) {
        var p = id && findPlayer(team, id);
        if (p) lineups.push({ playerId: id, teamType: team, lineupType: type,
          player: { id: id, name: p.name, jerseyNumber: p.jn } });
      }
      startingIds.forEach(function (id) { addPlayer(id, 'starting'); });
      t.subs.forEach(function (sub) {
        if (!startingIds.includes(sub.playerId)) {
          addPlayer(sub.playerId, 'substitute');
          var player = findPlayer(team, sub.playerId);
          if (player && !t.slots.some(function (slot) {
            return slot.playerId === sub.playerId || slot.outs?.some(function (record) { return record.playerId === sub.playerId; });
          })) publishStats(team, sub, player);
        }
      });
      t.slots.forEach(function (slot) {
        var history = (slot.outs || []).concat(slot);
        history.forEach(function (record, i) {
          var player = record.playerId && findPlayer(team, record.playerId);
          if (!player) return;
          publishStats(team, record, player);
          var next = history[i + 1];
          var incoming = next?.playerId && findPlayer(team, next.playerId);
          if (incoming) events.push({ teamType: team, eventType: 'substitution', eventTime: record.at + '′',
            playerId: incoming.id, playerName: incoming.name, subPlayerId: player.id, subPlayerName: player.name });
        });
      });
    });
    events.sort(function (a, b) { return (parseInt(a.eventTime, 10) || Infinity) - (parseInt(b.eventTime, 10) || Infinity); });
    demo.update(lineups, formations, events);
  }

  /* ---------- 渲染：名单面板 ---------- */
  function matchSearch(p, q) {
    if (!q) return true;
    var key = q.trim().toLowerCase();
    if (!key) return true;
    return String(p.jn).indexOf(key) >= 0 || p.name.toLowerCase().indexOf(key) >= 0;
  }

  function lineupPlayerId(slot) {
    return slot.outs?.[0]?.playerId || slot.playerId;
  }

  function visibleSlot(slot) {
    if (state.mode !== 'lineup' || !slot.outs?.length) return slot;
    return Object.assign({}, slot, slot.outs[0], { subIn: null, subOut: null, outs: [] });
  }

  function renderSquad(team) {
    var el = document.getElementById(team === 'home' ? 'homeSquad' : 'awaySquad');
    var t = state.teams[team];
    var players = allPlayers(team);
    var cls = team === 'home' ? 'home' : 'away';
    var q = state.search[team] || '';
    var onPitchIds = {};
    t.slots.forEach(function (s) { var id = visibleSlot(s).playerId; if (id) onPitchIds[id] = true; });

    var html = '';
    html += '<div class="panel-title ' + cls + '">' + teamName(team) + '（' + (team === 'home' ? '主' : '客') + '）</div>';
    html += '<input class="squad-search" type="text" id="' + team + 'Search" data-team="' + team + '" ' +
            'placeholder="搜索号码或姓名" value="' + q.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;') + '">';
    html += '<div class="sub-heading">首发 ' + t.slots.length + ' 人 · ' + t.formation + '</div>';

    var shownOnPitch = 0;
    // 按槽位顺序渲染：当前在场球员 + 该位置被换下的球员（↓）
    t.slots.forEach(function (slot, slotIdx) {
      slot = visibleSlot(slot);
      if (!slot.playerId) return;
      var p = findPlayer(team, slot.playerId);
      if (p && matchSearch(p, q)) {
        shownOnPitch++;
        var badges = '';
        if (slot.goals) badges += '<span class="mini-badge" style="background:#26c6da">球' + slot.goals + '</span>';
        if (slot.assists) badges += '<span class="mini-badge" style="background:#43a047">助' + slot.assists + '</span>';
        if (slot.red) badges += '<span class="mini-badge" style="background:#e53935">红</span>';
        if (slot.yellow) badges += '<span class="mini-badge" style="background:#fbc02d;color:#4e342e">黄' + slot.yellow + '</span>';
        var inTag = slot.subIn != null ? '<span class="sub-min in">↑' + slot.subIn + "'</span> " : '';
        html += '<div class="player-row ' + cls + ' on-pitch" data-team="' + team + '" data-player="' + p.id + '" data-action="pick-slot">' +
                '<span class="jn">' + p.jn + '</span><span class="nm">' + inTag + p.name + '</span>' + badges + '</div>';
      }
      // 被换下球员：灰色一行，保留其进球/助攻/红黄牌标注，可点击补录
      (slot.outs || []).forEach(function (o, oi) {
        var op = findPlayer(team, o.playerId);
        if (!op || !matchSearch(op, q)) return;
        var ob = '';
        if (o.goals) ob += '<span class="mini-badge" style="background:#26c6da">球' + o.goals + '</span>';
        if (o.assists) ob += '<span class="mini-badge" style="background:#43a047">助' + o.assists + '</span>';
        if (o.red) ob += '<span class="mini-badge" style="background:#e53935">红</span>';
        if (o.yellow) ob += '<span class="mini-badge" style="background:#fbc02d;color:#4e342e">黄' + o.yellow + '</span>';
        var offAction = state.mode === 'stats'
          ? ' data-action="stat-out" data-team="' + team + '" data-slot="' + slotIdx + '" data-out="' + oi + '"'
          : '';
        html += '<div class="player-row off-row ' + cls + '"' + offAction + '>' +
                '<span class="jn">' + op.jn + '</span>' +
                '<span class="nm">' + op.name +
                  ' <span class="sub-min out">↓' + o.at + "'</span>" +
                  (o.byName ? ' <span class="off-by">被 ' + o.byName + '</span>' : '') +
                '</span>' + ob + '</div>';
      });
    });
    if (q && shownOnPitch === 0) {
      html += '<div class="no-result">首发中无匹配球员</div>';
    }

    html += '<div class="sub-heading">' + (state.mode === 'lineup' ? '候选名单' : '替补席') + '</div>';
    var shownSubs = 0;
    t.subs.forEach(function (s) {
      var p = findPlayer(team, s.playerId);
      if (!p || !matchSearch(p, q)) return;
      shownSubs++;
      var used = s.subAt != null;
      var off = s.outAt != null;
      var isSel = state.selectedPlayer && state.selectedPlayer.team === team && state.selectedPlayer.playerId === p.id;
      var rowAction = state.mode === 'lineup' ? ' data-action="pick-slot"' : '';

      // 副标题：下场 / 上场 / 未上场
      var meta;
      if (off && s.replacedByName) {
        meta = '被 <span class="in-name">' + s.replacedByName + '</span> 换下';
      } else if (used && s.replacedName) {
        meta = '换下 <span class="out-name">' + s.replacedName + '</span>';
      } else if (state.mode === 'stats') {
        meta = '未上场 · ' + p.jn + ' 号';
      } else {
        meta = p.jn + ' 号';
      }

      var minutes = '';
      if (used) minutes += '<span class="sub-min in">↑' + s.subAt + "'</span>";
      if (off) minutes += '<span class="sub-min out">↓' + s.outAt + "'</span>";

      html += '<div class="sub-item ' + cls + (isSel ? ' selected' : '') +
              (used ? ' used' : '') + (off ? ' subbed-off' : '') + '"' + rowAction +
              ' data-team="' + team + '" data-player="' + p.id + '">' +
              '<div class="sub-avatar">' + p.jn + '</div>' +
              '<div class="sub-info">' +
                '<span class="sub-name">' + p.name + '</span>' +
                '<span class="sub-meta">' + meta + '</span>' +
              '</div>' +
              '<div class="sub-right">' +
                minutes +
                (state.mode === 'stats'
                  ? '<button class="sub-in-btn" ' + (used || off ? 'disabled' : '') +
                    ' data-team="' + team + '" data-player="' + p.id + '" data-action="sub-in">' +
                    (off ? '已下场' : used ? '已上场' : '换上') + '</button>'
                  : '') +
              '</div>' +
            '</div>';
    });
    if (q && shownSubs === 0) {
      html += '<div class="no-result">候选名单中无匹配球员</div>';
    }
    if (!t.subs.length) {
      html += '<div class="sub-empty">暂无替补球员</div>';
    }

    el.innerHTML = html;
  }

  /* ---------- 渲染：球场 ---------- */
  function renderPitch() {
    var el = document.getElementById('pitch');
    var html = '';

    html += '<svg viewBox="0 0 300 460" preserveAspectRatio="none">' +
      '<rect x="10" y="10" width="280" height="440" rx="8" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
      '<line x1="10" y1="230" x2="290" y2="230" stroke="var(--line)" stroke-width="2.5"/>' +
      '<circle cx="150" cy="230" r="34" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
      '<circle cx="150" cy="230" r="2.5" fill="var(--line)"/>' +
      // 顶部大禁区
      '<rect x="60" y="10" width="180" height="52" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
      // 顶部小禁区
      '<rect x="105" y="10" width="90" height="22" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
      '<circle cx="150" cy="44" r="2.5" fill="var(--line)"/>' +
      // 底部大禁区
      '<rect x="60" y="398" width="180" height="52" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
      '<rect x="105" y="428" width="90" height="22" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
      '<circle cx="150" cy="416" r="2.5" fill="var(--line)"/>' +
      '</svg>';

    html += '<div class="name-strip home">主队 · ' + state.teams.home.formation + '</div>';
    html += '<div class="name-strip away">客队 · ' + state.teams.away.formation + '</div>';

    ['home', 'away'].forEach(function (team) {
      var t = state.teams[team];
      t.slots.forEach(function (s, i) {
        s = visibleSlot(s);
        var x = (s.x * 100).toFixed(2);
        var y = (s.y * 100).toFixed(2);
        var p = s.playerId ? findPlayer(team, s.playerId) : null;

        if (!p) {
          var hasSel = state.mode === 'lineup' && state.selectedPlayer;
          var pickable = hasSel && state.selectedPlayer.team === team;
          var blocked = hasSel && state.selectedPlayer.team !== team;
          var slotCls = pickable ? ' pickable' : (blocked ? ' blocked' : '');
          html += '<div class="empty-slot' + slotCls + '" ' +
                  'style="left:' + x + '%;top:' + y + '%;" ' +
                  'data-team="' + team + '" data-slot="' + i + '" data-action="place"></div>';
          return;
        }

        var cls = team === 'home' ? 'home' : 'away';
        var badges = '';
        if (s.goals) badges += '<span class="badge badge-goal" title="进球 ' + s.goals + '">' + (s.goals > 1 ? s.goals : '') + '</span>';
        if (s.assists) badges += '<span class="badge badge-assist" title="助攻 ' + s.assists + '">' + (s.assists > 1 ? s.assists : '') + '</span>';
        if (s.yellow) badges += '<span class="badge badge-yellow" title="黄牌 ' + s.yellow + '"></span>';
        if (s.red) badges += '<span class="badge badge-red" title="红牌"></span>';
        var subTag = '';
        if (s.subOut != null) subTag = '<span class="sub-tag out"><span class="arrow">↓</span>' + s.subOut + "'</span>";
        else if (s.subIn != null) subTag = '<span class="sub-tag in"><span class="arrow">↑</span>' + s.subIn + "'</span>";

        html += '<div class="player-marker ' + cls + '" style="left:' + x + '%;top:' + y + '%;" ' +
                'data-team="' + team + '" data-slot="' + i + '" data-player="' + p.id + '" data-action="click-player">' +
                '<div class="num">' + p.jn +
                (badges ? '<div class="badges">' + badges + '</div>' : '') +
                '</div>' +
                '<div class="pname">' + p.name.replace(/^(主队|客队)球员/, '') + '</div>' +
                subTag + '</div>';
      });
    });

    el.innerHTML = html;
  }

  /* ---------- 提示 ---------- */
  function hint(type, msg) {
    var el = document.getElementById('hint');
    el.style.borderColor = type === 'warn' ? '#ff9800' : '#ffe082';
    el.style.background = type === 'warn' ? '#fff3e0' : '#fff8e1';
    if (msg) { el.textContent = msg; return; }
    el.style.borderColor = '#ffe082';
    el.style.background = '#fff8e1';
    if (state.mode === 'lineup') {
      if (state.selectedPlayer) {
        var p = findPlayer(state.selectedPlayer.team, state.selectedPlayer.playerId);
        var t = state.teams[state.selectedPlayer.team];
        var filled = t.slots.filter(function (s) { return s.playerId; }).length;
        el.textContent = '已选中 ' + p.name + '（' + p.jn + '号 · ' + (state.selectedPlayer.team === 'home' ? '主队' : '客队') + '），点击同侧高亮空位摆放。已排 ' + filled + '/' + t.slots.length + ' 人。点击场上球员可移回候选名单。';
        return;
      }
      el.textContent = '赛前模式：在两侧名单点击球员 → 再点同侧高亮空位摆放。点击已上场球员可移回候选名单。';
      return;
    }
    el.textContent = '赛后模式：点击场上球员标注进球/助攻/红黄牌；替补席点「换上」再点场上球员完成换人（记录分钟）。';
  }

  function render() {
    initSeasons();
    teams.forEach(syncSubstitutionStatuses);
    renderSquad('home');
    renderSquad('away');
    renderPitch();
    hint();
    updateHistoryButtons();
    saveLocal();
    publishMatch();
  }

  function initSeasons() {
    ['home', 'away'].forEach(function (team) {
      var sel = document.getElementById(team + 'Formation');
      sel.innerHTML = FORMATIONS.map(function (f) {
        return '<option value="' + f + '"' + (state.teams[team].formation === f ? ' selected' : '') + '>' + f + '</option>';
      }).join('');
    });
  }

  /* ---------- 交互 ---------- */
  function handleClicks(e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');
    var team = t.getAttribute('data-team');
    var slotIdx = t.getAttribute('data-slot') != null ? parseInt(t.getAttribute('data-slot'), 10) : null;
    var playerId = t.getAttribute('data-player');

    if (action === 'pick-slot') {
      onPickRow(team, playerId);
    } else if (action === 'place') {
      onPlace(team, slotIdx);
    } else if (action === 'click-player' && state.mode === 'lineup') {
      // 赛前模式：若已选中球员，点击场上球员 = 替换该槽位；否则 = 移除该球员
      if (state.selectedPlayer) {
        onPlace(team, slotIdx);
      } else {
        onPickRow(team, playerId);
      }
    } else if (action === 'click-player' && state.mode === 'stats') {
      openStatModal(team, slotIdx);
    } else if (action === 'sub-in') {
      onSubIn(team, playerId);
    } else if (action === 'stat-out') {
      var outIdx = parseInt(t.getAttribute('data-out'), 10);
      if (state.pendingSub) {
        hint('warn', '请选择仍在场上的球员换下。');
        return;
      }
      openStatModal(team, slotIdx, outIdx);
    }
  }

  function onPickRow(team, playerId) {
    if (state.mode !== 'lineup') return;
    // 如果已选中同一名球员，取消选中
    if (state.selectedPlayer &&
        state.selectedPlayer.team === team &&
        state.selectedPlayer.playerId === playerId) {
      state.selectedPlayer = null;
      render();
      return;
    }
    // 如果该球员已在场上，且当前没有从候选名单选中其他人 → 从场上移除回候选名单
    var t = state.teams[team];
    var onPitch = t.slots.find(function (s) { return lineupPlayerId(s) === playerId; });
    if (onPitch && !state.selectedPlayer) {
      if (onPitch.outs?.length) {
        hint('warn', '这个位置已有换人记录。可在赛后标注中点球员，撤回最近一次换人后再编辑。');
        return;
      }
      pushHistory();
      moveToBench(t, onPitch);
      render();
      return;
    }
    // 正常选中
    state.selectedPlayer = { team: team, playerId: playerId };
    render();
  }

  function moveToBench(t, slot) {
    if (slot.playerId && !t.subs.some(function (sub) { return sub.playerId === slot.playerId; })) {
      t.subs.push({ playerId: slot.playerId, goals: slot.goals, assists: slot.assists, yellow: slot.yellow, red: slot.red });
    }
    slot.playerId = null;
    slot.goals = slot.assists = slot.yellow = slot.red = 0;
  }

  function onPlace(team, slotIdx) {
    if (state.mode !== 'lineup') return;
    if (!state.selectedPlayer) return;
    // 队伍不匹配：不清空选中，给提示
    if (state.selectedPlayer.team !== team) {
      hint('warn', '选中的是' + (state.selectedPlayer.team === 'home' ? '主队' : '客队') + '球员，请点击同侧的空位！');
      return;
    }
    var playerId = state.selectedPlayer.playerId;
    var t = state.teams[team];
    var slot = t.slots[slotIdx];
    if (!slot) return;
    var from = t.slots.find(function (s) { return s.playerId === playerId; });
    if (from === slot) return;
    if (slot.outs?.length || from?.outs?.length ||
        t.slots.some(function (s) { return s.outs?.some(function (out) { return out.playerId === playerId; }); })) {
      hint('warn', '这个位置已有换人记录。可在赛后标注中点球员，撤回最近一次换人后再编辑。');
      return;
    }
    pushHistory();
    var record = from || t.subs.find(function (sub) { return sub.playerId === playerId; });
    var stats = record ? { goals: record.goals || 0, assists: record.assists || 0,
      yellow: record.yellow || 0, red: record.red || 0 } : null;
    moveToBench(t, slot);
    if (from) moveToBench(t, from);
    t.subs = t.subs.filter(function (s) { return s.playerId !== playerId; });
    slot.playerId = playerId;
    if (stats) Object.assign(slot, stats);
    state.selectedPlayer = null;
    render();
  }

  function onSubIn(team, playerId) {
    if (state.mode !== 'stats') return;
    var candidate = state.teams[team].subs.find(function (sub) { return sub.playerId === playerId; });
    if (!candidate || candidate.subAt != null || candidate.outAt != null) return;
    state.pendingSub = { team: team, playerId: playerId };
    render();
    hint();
    var sub = findPlayer(team, playerId);
    var el = document.getElementById('hint');
    el.textContent = '请点击场上要被换下的球员（' + sub.name + ' ' + sub.jn + '号 将换上）';
  }

  /* ---------- 赛后统计弹层 ---------- */
  function openStatModal(team, slotIdx, outIdx, historyRecorded) {
    // 若有待换上的替补，点击场上球员 = 完成换人
    if (state.pendingSub) {
      openSubForm(team, slotIdx);
      return;
    }
    var t = state.teams[team];
    var slot = t.slots[slotIdx];
    var isOut = outIdx != null;
    var s = isOut ? slot.outs[outIdx] : slot;
    var p = findPlayer(team, isOut ? s.playerId : slot.playerId);
    var html = '<h3>标注 · <span class="pname">' + p.name + '（' + p.jn + '号）</span>' +
      (isOut ? ' <span style="color:#e53935;font-size:12px;font-weight:600">已换下 ↓' + s.at + "'</span>" : '') +
      '</h3>';

    function row(label, key) {
      return '<div class="stat-row"><span class="label">' + label + '</span>' +
        '<div class="ctl">' +
          '<button data-op="dec" data-key="' + key + '">−</button>' +
          '<span class="val">' + s[key] + '</span>' +
          '<button data-op="inc" data-key="' + key + '">+</button>' +
        '</div></div>';
    }
    html += row('进球', 'goals');
    html += row('助攻', 'assists');
    html += row('黄牌', 'yellow');
    html += row('红牌', 'red');
    if (!isOut && slot.outs?.length) {
      html += '<button type="button" class="tool-btn revert-sub">撤回这个位置最近一次换人</button>';
    }
    html += '<button class="close-btn">完成</button>';

    var mask = document.getElementById('mask');
    var modal = document.getElementById('modal');
    modal.innerHTML = html;
    mask.classList.add('open');

    modal.querySelectorAll('button[data-op]').forEach(function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute('data-key');
        var op = btn.getAttribute('data-op');
        if (op === 'dec' && !s[key]) return;
        if (!historyRecorded) pushHistory();
        if (op === 'inc') s[key]++;
        else if (s[key] > 0) s[key]--;
        if (key === 'red' && s.red > 0) s.yellow = 0;
        renderPitch();              // 刷新球场角标
        renderSquad(team);          // 刷新名单徽章
        saveLocal();
        publishMatch();
        openStatModal(team, slotIdx, outIdx, true);
      };
    });
    modal.querySelector('.close-btn').onclick = closeModal;
    var revert = modal.querySelector('.revert-sub');
    if (revert) revert.onclick = function () {
      pushHistory();
      var outgoing = slot.outs.pop();
      var sub = t.subs.find(function (entry) { return entry.playerId === slot.playerId; });
      if (sub) {
        sub.goals = slot.goals;
        sub.assists = slot.assists;
        sub.yellow = slot.yellow;
        sub.red = slot.red;
      }
      slot.playerId = outgoing.playerId;
      slot.goals = outgoing.goals;
      slot.assists = outgoing.assists;
      slot.yellow = outgoing.yellow;
      slot.red = outgoing.red;
      slot.subIn = slot.outs.at(-1)?.at ?? null;
      closeModal();
    };
  }

  function openSubForm(team, slotIdx) {
    if (state.pendingSub.team !== team) {
      hint('warn', '请选择同队的球员换下。');
      return;
    }
    var t = state.teams[team];
    var slot = t.slots[slotIdx];
    var outPlayer = findPlayer(team, slot.playerId);
    var inPlayer = findPlayer(state.pendingSub.team, state.pendingSub.playerId);

    var html = '<h3>换人确认</h3>' +
      '<div class="sub-form">' +
      '<label>上场：' + inPlayer.name + '（' + inPlayer.jn + '号）</label>' +
      '<label>下场：' + outPlayer.name + '（' + outPlayer.jn + '号）</label>' +
      '<label>换人分钟</label>' +
      '<input type="number" id="subMin" min="1" max="120" value="60">' +
      '<div class="btns"><button class="cancel">取消</button><button class="confirm">确认换人</button></div>' +
      '</div>';

    var mask = document.getElementById('mask');
    var modal = document.getElementById('modal');
    modal.innerHTML = html;
    mask.classList.add('open');

    modal.querySelector('.cancel').onclick = function () {
      state.pendingSub = null;
      closeModal();
      render();
    };
    modal.querySelector('.confirm').onclick = function () {
      var input = document.getElementById('subMin');
      input.required = true;
      if (!input.reportValidity()) return;
      var min = input.valueAsNumber;
      if (slot.subIn != null && min < slot.subIn) {
        input.setCustomValidity('换下时间不能早于上场时间。');
        input.reportValidity();
        return;
      }
      pushHistory();
      var outId = slot.playerId;
      // 换下前先保存该球员的进球/助攻/红黄牌，避免被清零后丢失
      var outStats = {
        goals: slot.goals,
        assists: slot.assists,
        yellow: slot.yellow,
        red: slot.red
      };
      // 替补进入场上该槽位
      slot.playerId = inPlayer.id;
      var incoming = t.subs.find(function (sub) { return sub.playerId === inPlayer.id; });
      slot.goals = incoming?.goals || 0;
      slot.assists = incoming?.assists || 0;
      slot.yellow = incoming?.yellow || 0;
      slot.red = incoming?.red || 0;
      slot.subIn = min;
      slot.subOut = null;
      // 被换下的球员记录到该槽位，连同原有事件数据一起保留
      if (outId) {
        slot.outs = slot.outs || [];
        slot.outs.push({
          playerId: outId,
          at: min,
          byName: inPlayer.name,
          goals: outStats.goals,
          assists: outStats.assists,
          yellow: outStats.yellow,
          red: outStats.red
        });
      }
      state.pendingSub = null;
      closeModal();
    };
    modal.querySelector('#subMin').addEventListener('input', function () { this.setCustomValidity(''); });
  }

  function closeModal() {
    document.getElementById('mask').classList.remove('open');
    document.getElementById('modal').innerHTML = '';
    render();
  }

  /* ---------- 导入 / 导出 ---------- */
  function exportJSON() {
    var data = JSON.parse(snapshotState());
    ['home', 'away'].forEach(function (team) {
      data[team].label = team === 'home' ? '主队' : '客队';
      data[team].slots.forEach(function (s) {
        var p = s.playerId ? findPlayer(team, s.playerId) : null;
        s.number = p ? p.jn : null;
        s.name = p ? p.name : null;
      });
    });
    data.version = 1;
    data.exportedAt = new Date().toISOString();

    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'formation-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    hint('', '已导出 JSON 文件，可用「导入 JSON」恢复。');
  }

  function importJSON(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        validateSnapshot(d);
        pushHistory();
        restoreState(JSON.stringify(d));
        hint('', '已导入阵容数据。');
      } catch (err) {
        hint('warn', '导入失败：' + (err.message || '文件格式不正确'));
      }
    };
    reader.readAsText(file);
  }

  /* ---------- 事件绑定 ---------- */
  document.addEventListener('click', handleClicks);

  document.addEventListener('change', function (e) {
    if (e.target.id === 'homeFormation' || e.target.id === 'awayFormation') {
      var team = e.target.id === 'homeFormation' ? 'home' : 'away';
      pushHistory();
      var oldSlots = state.teams[team].slots;
      var newSlots = buildSlots(e.target.value, teamSide(team)).map(function (s, i) {
        return Object.assign({}, oldSlots[i], s);
      });
      state.teams[team].formation = e.target.value;
      state.teams[team].slots = newSlots;
      state.selectedPlayer = null;
      state.pendingSub = null;
      render();
    }
  });

  document.querySelectorAll('.mode-switch button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.mode = btn.getAttribute('data-mode');
      state.selectedPlayer = null;
      state.pendingSub = null;
      document.querySelectorAll('.mode-switch button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      closeModal();
    });
  });

  document.getElementById('mask').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    pushHistory();
    initTeam('home');
    initTeam('away');
    state.selectedPlayer = null;
    state.pendingSub = null;
    render();
  });

  document.getElementById('autoFillBtn').addEventListener('click', function () {
    var toFill = teams.map(function (team) {
      var t = state.teams[team];
      var available = t.subs.filter(function (sub) { return sub.subAt == null && sub.outAt == null; });
      return t.slots.filter(function (slot) { return !slot.playerId; }).slice(0, available.length)
        .map(function (slot, i) { return { team: t, slot: slot, sub: available[i] }; });
    }).flat();
    if (!toFill.length) {
      hint('', '没有可自动补齐的空位。');
      return;
    }
    pushHistory();
    toFill.forEach(function (entry) {
      var sub = entry.sub;
      Object.assign(entry.slot, {
        playerId: sub.playerId, goals: sub.goals || 0, assists: sub.assists || 0,
        yellow: sub.yellow || 0, red: sub.red || 0
      });
      entry.team.subs = entry.team.subs.filter(function (candidate) { return candidate !== sub; });
    });
    state.selectedPlayer = null;
    state.pendingSub = null;
    render();
  });

  /* ---------- 工具栏：撤销 / 重做 / 导入导出 ---------- */
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);
  document.getElementById('exportBtn').addEventListener('click', exportJSON);
  document.getElementById('importBtn').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) importJSON(f);
    e.target.value = '';
  });

  /* ---------- 名单搜索：只重绘对应面板并保持焦点 ---------- */
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id !== 'homeSearch' && id !== 'awaySearch') return;
    var team = id === 'homeSearch' ? 'home' : 'away';
    var caret = e.target.selectionStart;
    state.search[team] = e.target.value;
    renderSquad(team);
    var input = document.getElementById(id);
    if (input) {
      input.focus();
      if (caret != null) {
        try { input.setSelectionRange(caret, caret); } catch (err) { /* 忽略 */ }
      }
    }
  });

  /* ---------- 快捷键 ---------- */
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.target.closest('input, textarea, [contenteditable]') || document.getElementById('mask').classList.contains('open')) return;
    var k = String(e.key || '').toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
  });

  /* ---------- 启动 ---------- */
  seedMatch();
  if (!loadLocal()) render();
})();
</script>
